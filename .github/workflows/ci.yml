name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The shared package is the contract both halves compile against, so it
      # has to exist before anything else is type-checked.
      - run: npm run build:shared

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

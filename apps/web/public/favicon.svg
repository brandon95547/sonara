<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Sonara mark, a flat grand piano, on the app's dark. -->
  <rect width="32" height="32" rx="7" fill="#101010"/>
  <svg x="3" y="3" width="26" height="26" viewBox="68 78 399 384">
    <g fill="#fff">
      <!-- Piano body -->
      <path d="M78 283
               V178
               C78 119 120 82 177 82
               C239 82 270 119 306 166
               C339 209 368 230 414 236
               C443 240 457 254 457 279
               V292
               H78 Z"/>

      <!-- Keyboard frame -->
      <path d="M72 292 H463 V355 H72 Z"/>

      <!-- White keys -->
      <path d="M82 298 H119 V347 H82 Z
               M124 298 H161 V347 H124 Z
               M166 298 H203 V347 H166 Z
               M208 298 H245 V347 H208 Z
               M250 298 H287 V347 H250 Z
               M292 298 H329 V347 H292 Z
               M334 298 H371 V347 H334 Z
               M376 298 H413 V347 H376 Z
               M418 298 H453 V347 H418 Z"/>

      <!-- Base rail -->
      <path d="M72 355 H463 V371
               C463 378 458 383 451 383
               H84 C77 383 72 378 72 371 Z"/>

      <!-- Legs -->
      <path d="M92 380 H119 L113 445
               C112 453 107 458 100 458
               C93 458 89 453 90 445 Z"/>
      <path d="M416 380 H443 L445 445
               C446 453 441 458 434 458
               C427 458 422 453 421 445 Z"/>

      <!-- Pedal support -->
      <path d="M251 380 H278 V420 H251 Z"/>
      <path d="M259 414 H267 V440 H259 Z"/>
      <ellipse cx="247" cy="444" rx="13" ry="7"/>
      <ellipse cx="264" cy="446" rx="13" ry="7"/>
      <ellipse cx="281" cy="444" rx="13" ry="7"/>
    </g>

    <!-- Transparent key cutouts -->
    <mask id="keyMask">
      <rect width="512" height="512" fill="white"/>
      <g fill="black">
        <rect x="110" y="298" width="13" height="30" rx="2"/>
        <rect x="152" y="298" width="13" height="30" rx="2"/>
        <rect x="194" y="298" width="13" height="30" rx="2"/>
        <rect x="236" y="298" width="13" height="30" rx="2"/>
        <rect x="278" y="298" width="13" height="30" rx="2"/>
        <rect x="320" y="298" width="13" height="30" rx="2"/>
        <rect x="362" y="298" width="13" height="30" rx="2"/>
        <rect x="404" y="298" width="13" height="30" rx="2"/>
      </g>
    </mask>
    <path mask="url(#keyMask)" fill="#fff"
          d="M72 292 H463 V355 H72 Z"/>
  </svg>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Sonara mark, keys in a ring, on the app's dark. -->
  <rect width="32" height="32" rx="7" fill="#101010"/>
  <svg x="3" y="3" width="26" height="26" viewBox="69 63 1114 1114">
    <!-- ring -->
    <circle cx="626" cy="620" r="533.5" fill="none" stroke="#fff" stroke-width="39"/>
    <!-- white keys -->
    <g fill="#fff">
      <rect x="281.5" y="319.5" width="206.5" height="631" rx="36"/>
      <rect x="504" y="319.5" width="244" height="631" rx="36"/>
      <rect x="764" y="319.5" width="206.5" height="631" rx="36"/>
    </g>
    <!-- black keys -->
    <g fill="#000">
      <rect x="414.5" y="291.5" width="146" height="397" rx="24"/>
      <rect x="691.5" y="291.5" width="146" height="397" rx="24"/>
    </g>
  </svg>
</svg>

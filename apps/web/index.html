<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark only, deliberately. The token layer supports both themes, but this
         product ships one, and declaring it stops the browser painting a white
         flash before the CSS lands. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101010" />
    <meta
      name="description"
      content="Sonara — Next Level Piano Mastery. Play a virtual piano in your browser, connect a USB MIDI keyboard and watch every note you play."
    />
    <title>Sonara — Next Level Piano Mastery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
